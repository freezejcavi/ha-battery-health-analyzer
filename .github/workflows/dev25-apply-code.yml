name: Dev25 Apply Code

on:
  push:
    branches:
      - dev25-health-v2-calibration

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev25-health-v2-calibration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply dev25 production promotion
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'custom_components/battery_health/health_v2.py',
              'from collections.abc import Mapping, Sequence',
              'from collections.abc import Iterable, Mapping, Sequence',
          )
          replace_once(
              'custom_components/battery_health/health_v2.py',
              'TREND_STATES = ("stable", "falling", "recovering", "volatile", "insufficient")\n\nMIN_COVERAGE',
              '''TREND_STATES = ("stable", "falling", "recovering", "volatile", "insufficient")\n\n\ndef summarize_condition_states(\n    states: Iterable[str | None],\n) -> tuple[str | None, dict[str, int], int]:\n    """Summarize v2 conditions with actionable precedence and availability count."""\n    counts = {state: 0 for state in CONDITION_STATES}\n    unavailable = 0\n    for state in states:\n        if state in counts:\n            counts[state] += 1\n        else:\n            unavailable += 1\n\n    for state in ("replace", "weakening", "declining", "ok"):\n        if counts[state]:\n            return state, counts, unavailable\n    return None, counts, unavailable\n\n\nMIN_COVERAGE''',
          )

          replace_once(
              'custom_components/battery_health/sensor.py',
              '''    HEALTH_STATES,\n    VOLTAGE_OK_RATIO,\n    VOLTAGE_REPLACE_RATIO,\n    summarize_health_states,\n)''',
              '''    HEALTH_STATES as LEGACY_HEALTH_STATES,\n    VOLTAGE_OK_RATIO,\n    VOLTAGE_REPLACE_RATIO,\n    summarize_health_states as summarize_legacy_health_states,\n)''',
          )
          replace_once(
              'custom_components/battery_health/sensor.py',
              '''from .health_v2 import (\n    CONDITION_STATES as V2_CONDITION_STATES,\n)''',
              '''from .health_v2 import (\n    CONDITION_STATES as V2_CONDITION_STATES,\n    summarize_condition_states,\n)''',
          )
          replace_once(
              'custom_components/battery_health/sensor.py',
              '''_HEALTH_ICONS = {\n    "ok": "mdi:battery-check",\n    "weakening": "mdi:battery-alert",\n    "replace": "mdi:battery-alert-variant-outline",\n    "unknown": "mdi:battery-unknown",\n}''',
              '''_HEALTH_ICONS = {\n    "ok": "mdi:battery-check",\n    "declining": "mdi:battery-arrow-down-outline",\n    "weakening": "mdi:battery-alert",\n    "replace": "mdi:battery-alert-variant-outline",\n    "unknown": "mdi:battery-unknown",\n}''',
          )
          replace_once(
              'custom_components/battery_health/sensor.py',
              '''    _attr_options = list(HEALTH_STATES)''',
              '''    _attr_options = list(V2_CONDITION_STATES)''',
          )
          replace_once(
              'custom_components/battery_health/sensor.py',
              '''    @property\n    def native_value(self) -> str:\n        """Return the dev23 production state unchanged during dev24 shadowing."""\n        assessment = self.coordinator.health_assessments.get(self._device_id)\n        if assessment is None or assessment.candidate_state not in HEALTH_STATES:\n            return "unknown"\n        return assessment.candidate_state\n\n    @property\n    def icon(self) -> str:\n        """Return an icon matching the current production health state."""\n        return _HEALTH_ICONS.get(self.native_value, _HEALTH_ICONS["unknown"])''',
              '''    @property\n    def available(self) -> bool:\n        """Expose HA unavailable only when the v2 condition cannot be calculated."""\n        assessment = self.coordinator.health_v2_assessments.get(self._device_id)\n        return (\n            assessment is not None\n            and assessment.calculation_state != "unavailable"\n            and assessment.condition_state in V2_CONDITION_STATES\n        )\n\n    @property\n    def native_value(self) -> str | None:\n        """Return the promoted Health Model v2 condition."""\n        assessment = self.coordinator.health_v2_assessments.get(self._device_id)\n        if assessment is None or assessment.condition_state not in V2_CONDITION_STATES:\n            return None\n        return assessment.condition_state\n\n    @property\n    def icon(self) -> str:\n        """Return an icon matching the current v2 production condition."""\n        value = self.native_value\n        return _HEALTH_ICONS.get(value, _HEALTH_ICONS["unknown"])''',
          )
          replace_once(
              'custom_components/battery_health/sensor.py',
              '''    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        """Expose compact decision evidence without recording attribute churn."""\n        assessment = self.coordinator.health_assessments.get(self._device_id)\n        device = self._device()\n        if assessment is None:\n            return {\n                "confidence": 0.0,\n                "decision_path": "unavailable",\n                "reasons": ["health_assessment_unavailable"],\n                "limitations": [],\n                "source_device_id": self._device_id,\n            }\n\n        diagnostics = assessment.as_dict()\n        metrics = diagnostics["metrics"]\n        record = self.coordinator.baseline_v2_records.get(self._device_id)\n        return {\n            "confidence": diagnostics["confidence"],\n            "decision_path": assessment.decision_path,\n            "voltage_health_ratio": metrics["voltage_health_ratio"],\n            "battery_level_percent": metrics["battery_level_percent"],\n            "baseline_mv": metrics["baseline_mv"],\n            "current_voltage_p90_mv": metrics["current_voltage_p90_mv"],\n            "reasons": list(assessment.reasons),\n            "limitations": list(assessment.limitations),\n            "cycle_generation": (\n                record.cycle_generation if record is not None else None\n            ),\n            "source_device_id": self._device_id,\n            "battery_entity_id": (\n                device.battery_entity_id if device is not None else None\n            ),\n            "voltage_entity_id": (\n                device.voltage_entity_id if device is not None else None\n            ),\n            "temperature_entity_id": (\n                device.temperature_entity_id if device is not None else None\n            ),\n        }''',
              '''    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        """Expose compact v2 condition evidence without recording attribute churn."""\n        assessment = self.coordinator.health_v2_assessments.get(self._device_id)\n        legacy = self.coordinator.health_assessments.get(self._device_id)\n        device = self._device()\n        if assessment is None:\n            return {\n                "confidence": 0.0,\n                "calculation_state": "unavailable",\n                "trend_state": "insufficient",\n                "assessment_mode": "unavailable",\n                "reasons": ["health_v2_assessment_unavailable"],\n                "limitations": [],\n                "source_device_id": self._device_id,\n            }\n\n        diagnostics = assessment.as_dict()\n        metrics = diagnostics["metrics"]\n        record = self.coordinator.baseline_v2_records.get(self._device_id)\n        return {\n            "confidence": diagnostics["confidence"],\n            "calculation_state": assessment.calculation_state,\n            "trend_state": assessment.trend_state,\n            "assessment_mode": assessment.assessment_mode,\n            "signal": assessment.signal,\n            "current_24h_robust": metrics["current_24h_robust"],\n            "reference_7d": metrics["reference_7d"],\n            "reference_30d": metrics["reference_30d"],\n            "reference_used": metrics["reference_used"],\n            "ratio_to_reference": metrics["ratio_to_reference"],\n            "delta_from_reference": metrics["delta_from_reference"],\n            "recent_vs_previous": metrics["recent_vs_previous"],\n            "reasons": list(assessment.reasons),\n            "limitations": list(assessment.limitations),\n            "cycle_generation": (\n                record.cycle_generation if record is not None else None\n            ),\n            "legacy_dev23_state": (\n                legacy.candidate_state if legacy is not None else None\n            ),\n            "source_device_id": self._device_id,\n            "battery_entity_id": (\n                device.battery_entity_id if device is not None else None\n            ),\n            "voltage_entity_id": (\n                device.voltage_entity_id if device is not None else None\n            ),\n            "temperature_entity_id": (\n                device.temperature_entity_id if device is not None else None\n            ),\n        }''',
          )

          replace_once(
              'custom_components/battery_health/sensor.py',
              '''    _attr_options = list(HEALTH_STATES)\n    _attr_has_entity_name = True\n    _attr_name = "Summary"''',
              '''    _attr_options = list(V2_CONDITION_STATES)\n    _attr_has_entity_name = True\n    _attr_name = "Summary"''',
          )
          replace_once(
              'custom_components/battery_health/sensor.py',
              '''    def _state_by_device(self) -> list[tuple[str, str]]:\n        """Return current production health state paired with a readable name."""\n        result: list[tuple[str, str]] = []\n        for device in self.coordinator.data.devices:\n            assessment = self.coordinator.health_assessments.get(device.device_id)\n            state = (\n                assessment.candidate_state\n                if assessment is not None\n                and assessment.candidate_state in HEALTH_STATES\n                else "unknown"\n            )\n            result.append((state, device.device_name or device.device_id[:8]))\n        return result\n\n    @property\n    def native_value(self) -> str:\n        """Return the highest actionable aggregate production state."""\n        state, _counts = summarize_health_states(\n            state for state, _name in self._state_by_device()\n        )\n        return state\n\n    @property\n    def icon(self) -> str:\n        """Return an icon matching the aggregate production state."""\n        return _HEALTH_ICONS.get(self.native_value, _HEALTH_ICONS["unknown"])\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        """Expose compact production-state counts and attention lists."""\n        state_by_device = self._state_by_device()\n        _state, counts = summarize_health_states(\n            state for state, _name in state_by_device\n        )\n        names_by_state = {\n            state: [name for current, name in state_by_device if current == state]\n            for state in HEALTH_STATES\n        }\n        return {\n            "total": len(state_by_device),\n            "ok": counts["ok"],\n            "weakening": counts["weakening"],\n            "replace": counts["replace"],\n            "unknown": counts["unknown"],\n            "replace_devices": names_by_state["replace"],\n            "weakening_devices": names_by_state["weakening"],\n            "unknown_devices": names_by_state["unknown"],\n        }''',
              '''    def _state_by_device(self) -> list[tuple[str | None, str]]:\n        """Return v2 production conditions paired with readable device names."""\n        result: list[tuple[str | None, str]] = []\n        for device in self.coordinator.data.devices:\n            assessment = self.coordinator.health_v2_assessments.get(device.device_id)\n            state = (\n                assessment.condition_state\n                if assessment is not None\n                and assessment.calculation_state != "unavailable"\n                and assessment.condition_state in V2_CONDITION_STATES\n                else None\n            )\n            result.append((state, device.device_name or device.device_id[:8]))\n        return result\n\n    @property\n    def available(self) -> bool:\n        """Keep Summary available while at least one device has a v2 condition."""\n        state, _counts, _unavailable = summarize_condition_states(\n            current for current, _name in self._state_by_device()\n        )\n        return state is not None\n\n    @property\n    def native_value(self) -> str | None:\n        """Return replace > weakening > declining > ok across available devices."""\n        state, _counts, _unavailable = summarize_condition_states(\n            current for current, _name in self._state_by_device()\n        )\n        return state\n\n    @property\n    def icon(self) -> str:\n        """Return an icon matching the aggregate v2 production condition."""\n        return _HEALTH_ICONS.get(self.native_value, _HEALTH_ICONS["unknown"])\n\n    @property\n    def extra_state_attributes(self) -> dict[str, Any]:\n        """Expose v2 condition counts, availability and attention lists."""\n        state_by_device = self._state_by_device()\n        _state, counts, unavailable = summarize_condition_states(\n            current for current, _name in state_by_device\n        )\n        names_by_state = {\n            state: [name for current, name in state_by_device if current == state]\n            for state in V2_CONDITION_STATES\n        }\n        unavailable_devices = [\n            name for current, name in state_by_device if current is None\n        ]\n        return {\n            "total": len(state_by_device),\n            "available": len(state_by_device) - unavailable,\n            "unavailable": unavailable,\n            "ok": counts["ok"],\n            "declining": counts["declining"],\n            "weakening": counts["weakening"],\n            "replace": counts["replace"],\n            "replace_devices": names_by_state["replace"],\n            "weakening_devices": names_by_state["weakening"],\n            "declining_devices": names_by_state["declining"],\n            "unavailable_devices": unavailable_devices,\n        }''',
          )

          replace_once(
              'custom_components/battery_health/sensor.py',
              '''        health_counts = {state: 0 for state in HEALTH_STATES}\n        health_paths: dict[str, int] = {}''',
              '''        legacy_health_counts = {state: 0 for state in LEGACY_HEALTH_STATES}\n        legacy_health_paths: dict[str, int] = {}''',
          )
          replace_once(
              'custom_components/battery_health/sensor.py',
              '''            health = self.coordinator.health_assessments.get(device.device_id)\n            diagnostics["health_shadow"] = (\n                health.as_dict() if health is not None else None\n            )\n            if health is not None:\n                state = (\n                    health.candidate_state\n                    if health.candidate_state in health_counts\n                    else "unknown"\n                )\n                health_counts[state] += 1\n                health_paths[health.decision_path] = (\n                    health_paths.get(health.decision_path, 0) + 1\n                )''',
              '''            health = self.coordinator.health_assessments.get(device.device_id)\n            diagnostics["health_shadow"] = (\n                health.as_dict() if health is not None else None\n            )\n            if health is not None:\n                state = (\n                    health.candidate_state\n                    if health.candidate_state in legacy_health_counts\n                    else "unknown"\n                )\n                legacy_health_counts[state] += 1\n                legacy_health_paths[health.decision_path] = (\n                    legacy_health_paths.get(health.decision_path, 0) + 1\n                )''',
          )
          replace_once(
              'custom_components/battery_health/sensor.py',
              '''            diagnostics["health_v2_shadow"] = (\n                health_v2.as_dict() if health_v2 is not None else None\n            )''',
              '''            diagnostics["health_v2_shadow"] = (\n                health_v2.as_dict() if health_v2 is not None else None\n            )\n            diagnostics["health"] = (\n                health_v2.as_dict() if health_v2 is not None else None\n            )''',
          )
          replace_once(
              'custom_components/battery_health/sensor.py',
              '''        summary_state, _summary_counts = summarize_health_states(\n            health.candidate_state\n            for health in self.coordinator.health_assessments.values()\n        )''',
              '''        legacy_summary_state, _legacy_summary_counts = summarize_legacy_health_states(\n            health.candidate_state\n            for health in self.coordinator.health_assessments.values()\n        )''',
          )
          replace_once(
              'custom_components/battery_health/sensor.py',
              '''            "health_summary": summary_state,\n            "health_states": health_counts,\n            "health_paths": health_paths,''',
              '''            "health_summary": health_v2_summary,\n            "health_states": {**health_v2_conditions, "unavailable": health_v2_no_condition},\n            "health_calculation": health_v2_calculation,\n            "health_trends": health_v2_trends,\n            "health_modes": health_v2_modes,\n            "legacy_health_summary": legacy_summary_state,\n            "legacy_health_states": legacy_health_counts,\n            "legacy_health_paths": legacy_health_paths,''',
          )
          replace_once(
              'custom_components/battery_health/sensor.py',
              '''            "shadow_health_candidates": health_counts,\n            "shadow_health_paths": health_paths,''',
              '''            "shadow_health_candidates": legacy_health_counts,\n            "shadow_health_paths": legacy_health_paths,''',
          )

          Path('tests/test_health_entity_contract.py').write_text('''"""Static contract checks for dev25 published Health Model v2 entities."""\n\nfrom __future__ import annotations\n\nimport unittest\n\nfrom custom_components.battery_health.health_v2 import CONDITION_STATES\n\n\nclass HealthEntityContractTests(unittest.TestCase):\n    """Keep the public condition contract intentionally small and stable."""\n\n    def test_public_health_states_are_exactly_four_without_unknown(self) -> None:\n        self.assertEqual(\n            CONDITION_STATES,\n            ("ok", "declining", "weakening", "replace"),\n        )\n        self.assertNotIn("unknown", CONDITION_STATES)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')
          Path('tests/test_health_v2_summary.py').write_text('''"""Pure tests for dev25 Health Model v2 summary semantics."""\n\nfrom __future__ import annotations\n\nimport unittest\n\nfrom custom_components.battery_health.health_v2 import summarize_condition_states\n\n\nclass HealthV2SummaryTests(unittest.TestCase):\n    def test_actionable_precedence(self) -> None:\n        state, counts, unavailable = summarize_condition_states(\n            ["ok", "declining", "weakening", "replace", None]\n        )\n        self.assertEqual(state, "replace")\n        self.assertEqual(\n            counts,\n            {"ok": 1, "declining": 1, "weakening": 1, "replace": 1},\n        )\n        self.assertEqual(unavailable, 1)\n\n    def test_declining_outranks_ok(self) -> None:\n        state, counts, unavailable = summarize_condition_states(["ok", "declining"])\n        self.assertEqual(state, "declining")\n        self.assertEqual(counts["declining"], 1)\n        self.assertEqual(unavailable, 0)\n\n    def test_no_condition_maps_to_summary_unavailable(self) -> None:\n        state, counts, unavailable = summarize_condition_states([None, "unexpected"])\n        self.assertIsNone(state)\n        self.assertEqual(sum(counts.values()), 0)\n        self.assertEqual(unavailable, 2)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')

          replace_once(
              'custom_components/battery_health/manifest.json',
              '"version": "0.1.0-dev.24"',
              '"version": "0.1.0-dev.25"',
          )
          replace_once(
              'README.md',
              '**Current development version: `0.1.0-dev.24`**',
              '**Current development version: `0.1.0-dev.25`**',
          )
          replace_once(
              'README.md',
              '''The dev23 production entities remain unchanged during dev24. The v2 model is\npublished only inside diagnostics as `health_v2_shadow` until the complete real\nMQTT population is reviewed.''',
              '''Real dev24 validation on all 31 MQTT devices produced `25 ok / 5 declining /\n1 weakening / 0 replace`, `health_v2_without_condition = 0`, 28 `ready` and 3\nexplicitly `limited` calculations. All former 11 production `unknown` cases became\ncalculable conditions without introducing any new `weakening` or `replace` state.\nDev25 therefore promotes Health Model v2 to the existing production entity IDs.\nThe dev23 classifier remains available only as a temporary legacy diagnostic mirror.''',
          )
          replace_once(
              'README.md',
              '''## Published health entities\n\nThe currently published dev23 entity contract remains intentionally unchanged\nwhile dev24 is shadow-tested. Each discovered MQTT battery device has one enum\nsensor with these production states:\n\n- `ok`\n- `weakening`\n- `replace`\n- `unknown`''',
              '''## Published health entities\n\nDev25 publishes Health Model v2 through the existing per-device entity IDs. Each\ndiscovered MQTT battery device has one enum sensor with these production states:\n\n- `ok`\n- `declining`\n- `weakening`\n- `replace`''',
          )
          replace_once(
              'README.md',
              '''The aggregate `Summary` sensor currently uses dev23 actionable precedence:\n\n```text\nreplace > weakening > unknown > ok\n```\n\nNo production entity state or automation contract changes in dev24 until the new\nrelative model has passed real-data acceptance.\n\n## Health Model v2 shadow (dev24)''',
              '''The aggregate `Summary` sensor uses v2 actionable precedence:\n\n```text\nreplace > weakening > declining > ok\n```\n\nIf an individual condition truly cannot be calculated, that entity is Home\nAssistant `unavailable`; `unknown` is not a battery-condition state. Summary stays\navailable while at least one device has a calculable condition and exposes an\n`unavailable_devices` list.\n\n## Health Model v2 (dev25 production)''',
          )
          replace_once(
              'README.md',
              '## Dev23 production health engine',
              '## Legacy dev23 classifier (temporary diagnostic mirror)',
          )
          PY
      - name: Commit dev25 promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/battery_health/health_v2.py \
                  custom_components/battery_health/sensor.py \
                  custom_components/battery_health/manifest.json \
                  tests/test_health_entity_contract.py \
                  tests/test_health_v2_summary.py \
                  README.md
          git commit -m "dev25: promote Health Model v2 to production entities"
          git push
