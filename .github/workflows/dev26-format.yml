name: Dev26 Style Cleanup

on:
  push:
    branches:
      - dev26-release-hardening

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev26-release-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Apply Ruff fixes and formatting
        run: |
          python -m pip install ruff
          ruff check --fix custom_components/battery_health tests
          ruff format custom_components/battery_health tests
          ruff check custom_components/battery_health tests
      - name: Commit style cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components tests
          git commit -m "style: clean full repository with Ruff"
          git push
