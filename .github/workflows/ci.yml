name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant>=2026.9,<2026.10" ruff
      - name: Format dev24 changed code
        if: github.event_name == 'push' && github.ref_name == 'dev24-relative-health-v2'
        run: |
          ruff check --fix \
            custom_components/battery_health/health_v2.py \
            custom_components/battery_health/coordinator.py \
            custom_components/battery_health/sensor.py \
            tests/test_health_v2.py || true
          ruff format \
            custom_components/battery_health/health_v2.py \
            custom_components/battery_health/coordinator.py \
            custom_components/battery_health/sensor.py \
            tests/test_health_v2.py
      - name: Commit formatter output
        if: github.event_name == 'push' && github.ref_name == 'dev24-relative-health-v2'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custom_components/battery_health/health_v2.py \
                    custom_components/battery_health/coordinator.py \
                    custom_components/battery_health/sensor.py \
                    tests/test_health_v2.py
            git commit -m "style: format dev24 changed code"
            git push
          fi
      - name: Compile full repository
        run: python -m compileall -q custom_components tests
      - name: Ruff dev24 changed code
        id: ruff
        continue-on-error: true
        run: |
          set -o pipefail
          ruff check \
            custom_components/battery_health/health_v2.py \
            custom_components/battery_health/coordinator.py \
            custom_components/battery_health/sensor.py \
            tests/test_health_v2.py \
            2>&1 | tee ruff.log
      - name: Full unit tests
        id: tests
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee tests.log
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            ruff.log
            tests.log
      - name: Enforce validation
        if: always()
        run: |
          test "${{ steps.ruff.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
