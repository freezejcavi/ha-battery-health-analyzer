name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant>=2026.9,<2026.10" ruff
      - name: Compile
        run: python -m compileall -q custom_components tests
      - name: Ruff
        run: ruff check custom_components tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
