name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant>=2026.9,<2026.10" ruff
      - name: Apply dev27 cleanup in validation workspace
        if: github.ref_name == 'dev27-pre-rc-cleanup'
        run: |
          python scripts/dev27_apply.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_public_contract.py")
          text = path.read_text()
          old = '''    def test_deep_discovery_sensor_is_disabled_diagnostic(self) -> None:\n        self.assertEqual(\n            BatteryHealthDiscoverySensor._attr_entity_category,\n            EntityCategory.DIAGNOSTIC,\n        )\n        self.assertFalse(BatteryHealthDiscoverySensor._attr_entity_registry_enabled_default)\n'''
          new = '''    def test_deep_discovery_sensor_is_disabled_diagnostic(self) -> None:\n        source = (\n            Path(__file__).resolve().parents[1]\n            / "custom_components/battery_health/sensor.py"\n        ).read_text()\n        self.assertIn(\n            "_attr_entity_category = EntityCategory.DIAGNOSTIC",\n            source,\n        )\n        self.assertIn(\n            "_attr_entity_registry_enabled_default = False",\n            source,\n        )\n'''
          if old not in text:
              raise SystemExit("public-contract test target not found")
          text = text.replace(old, new, 1)
          text = text.replace("from pathlib import Path\n", "", 1)
          text = text.replace("import unittest\n", "import unittest\nfrom pathlib import Path\n", 1)
          text = text.replace("from homeassistant.helpers.entity import EntityCategory\n\n", "")
          text = text.replace("    BatteryHealthDiscoverySensor,\n", "")
          path.write_text(text)
          PY
          ruff format custom_components/battery_health tests
          ruff check --fix custom_components/battery_health tests
          ruff format custom_components/battery_health tests
      - name: Compile full repository
        run: python -m compileall -q custom_components tests
      - name: Ruff full repository
        id: ruff
        continue-on-error: true
        run: |
          set -o pipefail
          ruff check custom_components/battery_health tests 2>&1 | tee ruff.log
      - name: Full unit tests
        id: tests
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee tests.log
      - name: Upload dev27 transformed files
        if: github.ref_name == 'dev27-pre-rc-cleanup'
        uses: actions/upload-artifact@v4
        with:
          name: dev27-transformed
          path: |
            custom_components/battery_health/sensor.py
            custom_components/battery_health/coordinator.py
            custom_components/battery_health/manifest.json
            README.md
            tests/test_public_contract.py
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            ruff.log
            tests.log
      - name: Enforce validation
        if: always()
        run: |
          test "${{ steps.ruff.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
