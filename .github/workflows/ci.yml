name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant>=2026.9,<2026.10" ruff
      - name: Compile full repository
        run: python -m compileall -q custom_components tests
      - name: Ruff full repository
        id: ruff
        continue-on-error: true
        run: |
          set -o pipefail
          ruff check custom_components/battery_health tests 2>&1 | tee ruff.log
      - name: Full unit tests
        id: tests
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee tests.log
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            ruff.log
            tests.log
      - name: Enforce validation
        if: always()
        run: |
          test "${{ steps.ruff.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
